[project]
name = "file-encoding-sniffer-tools"
version = "0.1.1"
description = "Detects text file encoding by inspecting the BOM and initial bytes, returning a Python codec name."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
